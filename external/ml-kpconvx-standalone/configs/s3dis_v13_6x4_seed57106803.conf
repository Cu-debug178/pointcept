# Standalone KPConvX V13 S3DIS launch configuration.
# This file is sourced by train_S3DIS_v13_6x4_seed57106803.sh.
# It is intentionally independent of Pointcept's native configs.

STANDALONE_ROOT="${STANDALONE_ROOT:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
DATA_DIR="${DATA_DIR:-/root/autodl-tmp/data/s3dis}"
PYTHON_BIN="${PYTHON_BIN:-/root/autodl-tmp/envs/pointcept/bin/python}"
CUDA_VISIBLE_DEVICES="${CUDA_VISIBLE_DEVICES:-0}"
PYTORCH_CUDA_ALLOC_CONF="${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

# Matched-seed experiment used by the aligned Standalone run.
SEED="${SEED:-57106803}"

# Effective batch is 6 * 4 = 24. To roll back to the previous Standalone
# setting, use BATCH_SIZE=4 and ACCUM_BATCH=6 (both values are explicit here).
BATCH_SIZE="${BATCH_SIZE:-6}"
ACCUM_BATCH="${ACCUM_BATCH:-4}"

NUM_WORKERS="${NUM_WORKERS:-10}"
STEPS_PER_EPOCH="${STEPS_PER_EPOCH:-300}"
MAX_EPOCH="${MAX_EPOCH:-450}"

# V13 density-adaptive radius profile from commit 81f36aa.
DA_RADIUS_PROFILE="${DA_RADIUS_PROFILE:-pointcept_v13}"
DA_RADIUS_DEBUG="${DA_RADIUS_DEBUG:-1}"
BUILD_EXTENSIONS="${BUILD_EXTENSIONS:-1}"

LOG_PATH="${LOG_PATH:-$STANDALONE_ROOT/results/S3DIS_KPConvX-V13-L-6x4-seed57106803}"
